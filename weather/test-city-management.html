<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市管理功能测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            padding: 20px;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .test-btn {
            margin: 5px;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
        }
        .success { background: rgba(40, 167, 69, 0.3); }
        .error { background: rgba(220, 53, 69, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">城市管理功能测试</h1>

        <div class="test-container">
            <h3>1. 城市搜索功能测试</h3>
            <button class="btn btn-primary test-btn" onclick="testCitySearch()">
                <i class="fas fa-search"></i> 测试城市搜索
            </button>
            <div id="searchResult" class="result"></div>
        </div>

        <div class="test-container">
            <h3>2. 批量操作功能测试</h3>
            <button class="btn btn-primary test-btn" onclick="testBatchMode()">
                <i class="fas fa-check-square"></i> 测试批量模式
            </button>
            <button class="btn btn-success test-btn" onclick="testSelectAll()">
                <i class="fas fa-tasks"></i> 测试全选
            </button>
            <button class="btn btn-danger test-btn" onclick="testBatchDelete()">
                <i class="fas fa-trash"></i> 测试批量删除
            </button>
            <div id="batchResult" class="result"></div>
        </div>

        <div class="test-container">
            <h3>3. 排序和分组功能测试</h3>
            <button class="btn btn-primary test-btn" onclick="testSortByName()">
                <i class="fas fa-sort-alpha-down"></i> 按名称排序
            </button>
            <button class="btn btn-primary test-btn" onclick="testSortByCountry()">
                <i class="fas fa-globe"></i> 按国家排序
            </button>
            <button class="btn btn-primary test-btn" onclick="testGroupByRegion()">
                <i class="fas fa-object-group"></i> 按地区分组
            </button>
            <div id="sortResult" class="result"></div>
        </div>

        <div class="test-container">
            <h3>4. 导入导出功能测试</h3>
            <button class="btn btn-primary test-btn" onclick="testExportCities()">
                <i class="fas fa-download"></i> 测试导出城市
            </button>
            <button class="btn btn-primary test-btn" onclick="testImportCities()">
                <i class="fas fa-upload"></i> 测试导入城市
            </button>
            <div id="importExportResult" class="result"></div>
        </div>

        <div class="test-container">
            <h3>5. 热门城市推荐测试</h3>
            <button class="btn btn-primary test-btn" onclick="testPopularCities()">
                <i class="fas fa-fire"></i> 测试热门城市
            </button>
            <div id="popularResult" class="result"></div>
        </div>
    </div>

    <script>
        // 模拟WeatherApp类的方法进行测试
        class CityManagementTest {
            constructor() {
                this.savedCities = [
                    { name: "北京", country: "CN" },
                    { name: "上海", country: "CN" },
                    { name: "纽约", country: "US" },
                    { name: "伦敦", country: "GB" }
                ];
                this.batchMode = false;
                this.selectedCities = new Set();
                this.sortMode = 'none';
                this.groupByRegion = false;
            }

            testCitySearch() {
                const searchResults = [
                    { name: "北京", country: "CN" },
                    { name: "上海", country: "CN" },
                    { name: "纽约", country: "US" }
                ];
                this.showResult('searchResult', `找到 ${searchResults.length} 个城市`, 'success');
            }

            testBatchMode() {
                this.batchMode = !this.batchMode;
                const status = this.batchMode ? '开启' : '关闭';
                this.showResult('batchResult', `批量模式已${status}`, 'success');
            }

            testSelectAll() {
                this.selectedCities.clear();
                this.savedCities.forEach((_, index) => {
                    this.selectedCities.add(index);
                });
                this.showResult('batchResult', `已选择 ${this.selectedCities.size} 个城市`, 'success');
            }

            testBatchDelete() {
                const deletedCount = this.selectedCities.size;
                if (deletedCount === 0) {
                    this.showResult('batchResult', '请先选择要删除的城市', 'error');
                    return;
                }
                this.showResult('batchResult', `已删除 ${deletedCount} 个城市`, 'success');
            }

            testSortByName() {
                this.savedCities.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                this.sortMode = 'name';
                this.showResult('sortResult', '已按名称排序', 'success');
            }

            testSortByCountry() {
                this.savedCities.sort((a, b) => {
                    const countryA = a.country || '';
                    const countryB = b.country || '';
                    return countryA.localeCompare(countryB);
                });
                this.sortMode = 'country';
                this.showResult('sortResult', '已按国家排序', 'success');
            }

            testGroupByRegion() {
                this.groupByRegion = !this.groupByRegion;
                const status = this.groupByRegion ? '开启' : '关闭';
                this.showResult('sortResult', `地区分组已${status}`, 'success');
            }

            testExportCities() {
                const dataStr = JSON.stringify(this.savedCities, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);

                const link = document.createElement('a');
                link.href = url;
                link.download = `cities_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                this.showResult('importExportResult', `已导出 ${this.savedCities.length} 个城市`, 'success');
            }

            testImportCities() {
                const mockCities = [
                    { name: "东京", country: "JP" },
                    { name: "巴黎", country: "FR" }
                ];

                let imported = 0;
                mockCities.forEach(city => {
                    const exists = this.savedCities.some(c =>
                        c.name === city.name && c.country === city.country
                    );
                    if (!exists) {
                        this.savedCities.push(city);
                        imported++;
                    }
                });

                this.showResult('importExportResult', `成功导入 ${imported} 个城市`, 'success');
            }

            testPopularCities() {
                const popularCities = [
                    { name: '北京', country: 'CN' },
                    { name: '上海', country: 'CN' },
                    { name: '纽约', country: 'US' },
                    { name: '伦敦', country: 'GB' }
                ];
                this.showResult('popularResult', `显示 ${popularCities.length} 个热门城市推荐`, 'success');
            }

            showResult(elementId, message, type) {
                const element = document.getElementById(elementId);
                element.innerHTML = `<div class="${type}">${message}</div>`;
            }
        }

        const cityTest = new CityManagementTest();

        // 全局测试函数
        function testCitySearch() { cityTest.testCitySearch(); }
        function testBatchMode() { cityTest.testBatchMode(); }
        function testSelectAll() { cityTest.testSelectAll(); }
        function testBatchDelete() { cityTest.testBatchDelete(); }
        function testSortByName() { cityTest.testSortByName(); }
        function testSortByCountry() { cityTest.testSortByCountry(); }
        function testGroupByRegion() { cityTest.testGroupByRegion(); }
        function testExportCities() { cityTest.testExportCities(); }
        function testImportCities() { cityTest.testImportCities(); }
        function testPopularCities() { cityTest.testPopularCities(); }
    </script>
</body>
</html>
