<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报 - 修复版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/weather-icons.css">
    <link rel="stylesheet" href="css/weather-alerts.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-cloud-sun me-2"></i>
                    天气预报
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" id="currentWeatherTab">当前天气</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="forecastTab">天气预报</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="hourlyTab">逐小时预报</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <button class="btn btn-outline-light me-2" id="themeToggle">
                            <i class="fas fa-moon"></i>
                        </button>
                        <button class="btn btn-outline-light" id="addCityBtn">
                            <i class="fas fa-plus"></i> 添加城市
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主要内容区域 -->
        <div class="container-fluid">
            <div class="row">
                <!-- 侧边栏 - 城市列表 -->
                <div class="col-md-3 col-lg-2 sidebar">
                    <div class="city-list">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">城市管理</h5>
                            <button class="btn btn-sm btn-outline-primary" id="batchModeBtn" title="批量操作">
                                <i class="fas fa-check-square"></i>
                            </button>
                        </div>
                        <div id="batchControls" style="display: none;">
                            <div class="btn-group btn-group-sm mb-2" role="group">
                                <button class="btn btn-outline-success" id="selectAllBtn">全选</button>
                                <button class="btn btn-outline-secondary" id="deselectAllBtn">取消</button>
                                <button class="btn btn-outline-danger" id="batchDeleteBtn">删除</button>
                            </div>
                            <div class="btn-group btn-group-sm mb-2" role="group">
                                <button class="btn btn-outline-primary" id="exportCitiesBtn">导出</button>
                                <button class="btn btn-outline-primary" id="importCitiesBtn">导入</button>
                            </div>
                        </div>
                        <div id="sortControls" class="mb-2">
                            <div class="btn-group btn-group-sm" role="group">
                                <button class="btn btn-outline-secondary" id="sortByNameBtn">按名称</button>
                                <button class="btn btn-outline-secondary" id="sortByCountryBtn">按国家</button>
                                <button class="btn btn-outline-secondary" id="groupByRegionBtn">分组</button>
                            </div>
                        </div>
                        <div id="cityList">
                            <!-- 城市列表将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 主内容区 -->
                <div class="col-md-9 col-lg-10 main-content">
                    <!-- 当前天气信息 -->
                    <div id="currentWeatherContent" class="weather-content">
                        <div class="current-weather-card">
                            <div class="text-center py-5">
                                <h2>🌤️ 天气应用已修复</h2>
                                <p class="lead">导航功能现在应该可以正常工作了</p>
                                <div class="alert alert-info mt-3">
                                    <strong>说明：</strong>这是一个修复版本，包含了导航功能的修复脚本。
                                    如果导航功能仍然有问题，请查看浏览器控制台获取详细信息。
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 天气预报内容 -->
                    <div id="forecastContent" class="weather-content" style="display: none;">
                        <div class="text-center py-5">
                            <h2>📅 天气预报</h2>
                            <p>这里是天气预报内容</p>
                        </div>
                    </div>

                    <!-- 逐小时预报内容 -->
                    <div id="hourlyContent" class="weather-content" style="display: none;">
                        <div class="text-center py-5">
                            <h2>⏰ 逐小时预报</h2>
                            <p>这里是逐小时预报内容</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加城市模态框 -->
        <div class="modal fade" id="addCityModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">添加城市</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="citySearch" class="form-label">搜索城市</label>
                            <input type="text" class="form-control" id="citySearch" placeholder="输入城市名称...">
                        </div>
                        <div id="searchResults" class="list-group" style="max-height: 200px; overflow-y: auto;">
                            <!-- 搜索结果将通过JavaScript动态生成 -->
                        </div>
                        <div id="popularCities" class="mt-3">
                            <h6 class="text-muted mb-2">热门城市</h6>
                            <div class="d-flex flex-wrap gap-2">
                                <!-- 热门城市将通过JavaScript动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript文件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/weather-api.js"></script>
    <script src="js/location.js"></script>
    <script src="js/weather-indices.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/main.js"></script>
    <script src="fix-navigation.js"></script>
</body>
</html>
