<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报 - 实时天气信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/weather-icons.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-cloud-sun me-2"></i>
                    天气预报
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" id="currentWeatherTab">当前天气</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="forecastTab">天气预报</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="hourlyTab">逐小时预报</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <button class="btn btn-outline-light me-2" id="themeToggle">
                            <i class="fas fa-moon"></i>
                        </button>
                        <button class="btn btn-outline-light" id="addCityBtn">
                            <i class="fas fa-plus"></i> 添加城市
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主要内容区域 -->
        <div class="container-fluid">
            <div class="row">
                <!-- 侧边栏 - 城市列表 -->
                <div class="col-md-3 col-lg-2 sidebar">
                    <div class="city-list">
                        <h5 class="mb-3">城市管理</h5>
                        <div id="cityList">
                            <!-- 城市列表将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 主内容区 -->
                <div class="col-md-9 col-lg-10 main-content">
                    <!-- 加载状态 -->
                    <div id="loadingSpinner" class="text-center my-5" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                        <p class="mt-2">正在获取天气信息...</p>
                    </div>

                    <!-- 错误提示 -->
                    <div id="errorAlert" class="alert alert-danger" style="display: none;">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span id="errorMessage"></span>
                    </div>

                    <!-- 当前天气信息 -->
                    <div id="currentWeatherContent" class="weather-content">
                        <div class="current-weather-card">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="current-temp">
                                        <h1 id="currentTemp">--°</h1>
                                        <p id="weatherDesc" class="text-muted">--</p>
                                    </div>
                                    <div class="location-info">
                                        <h3 id="cityName">--</h3>
                                        <p id="updateTime" class="text-muted small">更新时间: --</p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="weather-icon-large text-center">
                                        <i id="weatherIcon" class="fas fa-cloud-sun fa-6x"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="weather-details mt-4">
                                <div class="row">
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item">
                                            <i class="fas fa-thermometer-half text-primary"></i>
                                            <span class="detail-label">体感温度</span>
                                            <span class="detail-value" id="feelsLike">--°C</span>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item">
                                            <i class="fas fa-tint text-info"></i>
                                            <span class="detail-label">湿度</span>
                                            <span class="detail-value" id="humidity">--%</span>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item">
                                            <i class="fas fa-wind text-success"></i>
                                            <span class="detail-label">风速</span>
                                            <span class="detail-value" id="windSpeed">-- m/s</span>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item">
                                            <i class="fas fa-mask text-warning"></i>
                                            <span class="detail-label">空气质量</span>
                                            <span class="detail-value" id="airQuality">--</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 天气预报内容 -->
                    <div id="forecastContent" class="weather-content" style="display: none;">
                        <h4 class="mb-4">7天天气预报</h4>
                        <div class="row" id="forecastCards">
                            <!-- 预报卡片将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 逐小时预报内容 -->
                    <div id="hourlyContent" class="weather-content" style="display: none;">
                        <h4 class="mb-4">24小时预报</h4>
                        <div class="chart-container">
                            <canvas id="hourlyChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加城市模态框 -->
        <div class="modal fade" id="addCityModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">添加城市</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="citySearch" class="form-label">搜索城市</label>
                            <input type="text" class="form-control" id="citySearch" placeholder="输入城市名称...">
                        </div>
                        <div id="searchResults" class="list-group" style="max-height: 200px; overflow-y: auto;">
                            <!-- 搜索结果将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript文件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/weather-api.js"></script>
    <script src="js/location.js"></script>
    <script src="js/charts.js"></script>
</body>
</html>
